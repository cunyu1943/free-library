name: 检测资源链接状态

on:
  # 注意：链接检测已整合进 auto-deploy.yml（每小时整点随部署一起运行），
  # 为避免两个定时任务同时提交 docs/src/guide.md 造成冲突，这里仅保留手动触发。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 检测并更新链接状态
        run: python .github/scripts/check_links.py

      - name: 提交更新
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 更新资源链接检测状态"
          file_pattern: "docs/src/guide.md"
